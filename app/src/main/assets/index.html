<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Universo Escolar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040d;color:#eefaff;font-family:Georgia,serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}#title{position:absolute;top:5%;left:50%;transform:translateX(-50%);text-align:center;width:90%;text-shadow:0 0 24px #3cdcff66}
#title small{display:block;letter-spacing:.28em;color:#7df6ff;font:700 11px Arial;text-transform:uppercase}#title h1{margin:8px 0 0;font-size:clamp(30px,5vw,64px);line-height:.95}
#hint{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font:12px Arial;color:#9cc6d8;background:#061329aa;border:1px solid #6eeaff33;padding:9px 14px;border-radius:99px}
#tooltip{position:fixed;z-index:20;pointer-events:none;opacity:0;transform:translate(-50%,-120%);padding:8px 12px;border-radius:12px;background:#07142ee8;border:1px solid #79f7ff55;color:white;font:700 12px Arial;transition:.15s}
#world{position:fixed;inset:0;z-index:30;display:none;background:radial-gradient(circle at 50% 120%,var(--glow),#030817 58%,#01030a);overflow:hidden}#world.open{display:block}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.p{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:up var(--d) linear infinite;opacity:.6}@keyframes up{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
#worldHead{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:92%;text-align:center;z-index:2}#worldHead small{font:700 11px Arial;letter-spacing:.28em;color:var(--accent);text-transform:uppercase}
#worldHead h2{margin:7px 0 7px;font-size:clamp(30px,5vw,60px)}#worldHead p{margin:0 auto;max-width:680px;color:#b6cbdc;font:13px/1.5 Arial}
#progress{width:min(500px,75vw);height:7px;margin:14px auto;background:#ffffff12;border-radius:99px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff0a0);box-shadow:0 0 14px var(--accent);transition:.4s}
#route{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(1050px,94vw);height:min(500px,58vh)}#route svg{position:absolute;inset:0;width:100%;height:100%}#route path{fill:none;stroke:#dff6ff44;stroke-width:3;stroke-dasharray:9 11}
.level{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:1px solid #ffffff28;background:#07142dcc;color:#eefaff;box-shadow:0 12px 30px #0008;cursor:pointer}
.level.available{border-color:var(--accent);box-shadow:0 0 25px var(--soft),0 12px 30px #0008}.level.completed{border-color:#ffe37a}.level.locked{filter:grayscale(1);opacity:.35}
.level b{display:block;font:800 11px Arial}.level span{font-size:25px}.level i{position:absolute;top:105%;left:50%;transform:translateX(-50%);width:130px;font:10px Arial;font-style:normal;text-shadow:0 2px 5px #000}
#back{position:absolute;left:18px;bottom:18px;z-index:5;border:1px solid #ffffff33;background:#05132bcc;color:#fff;padding:11px 15px;border-radius:14px}
#modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#01040bbb;backdrop-filter:blur(8px);padding:20px}#modal.open{display:flex}
.card{width:min(620px,92vw);padding:27px;border-radius:24px;background:linear-gradient(145deg,#081633,#020714);border:1px solid #79efff44;box-shadow:0 25px 80px #0009}.card small{color:var(--accent);letter-spacing:.2em}.card h3{font-size:34px;margin:8px 0}.card p{font:14px/1.55 Arial;color:#bfd2df}
.actions{display:flex;justify-content:flex-end;gap:10px}.actions button{padding:10px 14px;border-radius:12px;border:1px solid #ffffff28;background:#ffffff0c;color:white}.actions .primary{border-color:var(--accent);background:var(--soft)}
@media(max-width:720px){.level{width:65px;height:65px}.level span{font-size:19px}.level i{width:95px;font-size:8px}#route{top:60%;height:60vh}}
</style></head><body>
<div id="hud"><div id="title"><small>Mapa de aprendizaje 3D</small><h1>Universo Escolar</h1></div><div id="hint">Arrastra para explorar · toca un planeta</div></div><div id="tooltip"></div>
<div id="world"><div id="particles"></div><div id="worldHead"><small>Mundo de aprendizaje</small><h2 id="worldName"></h2><p id="worldDesc"></p><div id="progress"><div id="bar"></div></div></div>
<div id="route"><svg viewBox="0 0 1000 500" preserveAspectRatio="none"><path d="M65 375 C180 305 170 115 315 135 S435 390 565 300 S680 90 795 145 S845 385 945 225"/></svg></div>
<button id="back">← Universo</button><div id="modal"><div class="card"><small id="meta"></small><h3 id="levelName"></h3><p id="levelDesc"></p><div class="actions"><button id="close">Regresar</button><button id="complete" class="primary">Completar misión ⭐</button></div></div></div></div>
<script src="three.min.js"></script><script>
const SUBJECTS=[
{id:'mate',name:'Matemáticas',color:0x4aa8ff,accent:'#62c7ff',soft:'rgba(98,199,255,.24)',desc:'Lógica, números, operaciones, fracciones y geometría.',levels:['Suma orbital','Resta lunar','Multiplicación turbo','División galáctica','Fracciones estelares','Geometría cósmica','Agujero negro']},
{id:'espanol',name:'Español',color:0xff5968,accent:'#ff7080',soft:'rgba(255,112,128,.24)',desc:'Lectura, escritura, ortografía y comprensión.',levels:['Palabras perdidas','Acentos en órbita','Sinónimos secretos','Construcción de oraciones','Comprensión lectora','Narración interestelar','Biblioteca roja']},
{id:'ciencias',name:'Ciencias Naturales',color:0x48db78,accent:'#63f18d',soft:'rgba(99,241,141,.22)',desc:'Vida, ecosistemas, cuerpo humano, materia y energía.',levels:['Célula base','Ecosistema verde','Materia y energía','Cuerpo humano','Planeta agua','Fuerzas invisibles','Bioestación']},
{id:'historia',name:'Historia',color:0xf2bd48,accent:'#ffd06a',soft:'rgba(255,208,106,.22)',desc:'Civilizaciones, líneas del tiempo y procesos históricos.',levels:['Portal antiguo','Civilizaciones','Exploradores','Independencias','México moderno','Fuentes históricas','Archivo del tiempo']},
{id:'ingles',name:'Inglés',color:0xb767f1,accent:'#d080ff',soft:'rgba(208,128,255,.24)',desc:'Vocabulario, expresiones y comunicación básica.',levels:['Hello, Earth!','Space Objects','Mission Verbs','Present Simple','Questions Deck','Listening Radar','First Contact']},
{id:'arte',name:'Arte / Educación Física',color:0xff8d38,accent:'#ff9c4e',soft:'rgba(255,156,78,.24)',desc:'Creatividad, ritmo, movimiento y expresión.',levels:['Nebulosa de color','Ritmo orbital','Formas en movimiento','Galería cósmica','Desafío motriz','Expresión total','Festival solar']}];
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);camera.position.set(0,22,78);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x02040d);document.body.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8bbcff,.55));const light=new THREE.PointLight(0xffffff,2.3,180);light.position.set(0,10,15);scene.add(light);
const stars=new THREE.BufferGeometry(),N=2400,pos=new Float32Array(N*3);for(let i=0;i<N;i++){const r=70+Math.random()*220,a=Math.random()*Math.PI*2,u=Math.random()*2-1,s=Math.sqrt(1-u*u);pos[i*3]=r*s*Math.cos(a);pos[i*3+1]=r*u;pos[i*3+2]=r*s*Math.sin(a)}stars.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xbcecff,size:.55,transparent:true,opacity:.8})));
const core=new THREE.Mesh(new THREE.SphereGeometry(8,48,48),new THREE.MeshPhongMaterial({color:0xffc44d,emissive:0x9a4d06,shininess:90}));scene.add(core);scene.add(new THREE.PointLight(0xffb84c,2.5,90));
const planets=[],groups=[];SUBJECTS.forEach((s,i)=>{const g=new THREE.Group(),r=4.2+(i%3)*.35,p=new THREE.Mesh(new THREE.SphereGeometry(r,44,44),new THREE.MeshPhongMaterial({color:s.color,emissive:s.color,emissiveIntensity:.17,shininess:75}));p.userData.subject=s;g.add(p);if(i===0||i===5){const ring=new THREE.Mesh(new THREE.RingGeometry(r*1.35,r*1.6,72),new THREE.MeshBasicMaterial({color:0xcaf6ff,transparent:true,opacity:.48,side:THREE.DoubleSide}));ring.rotation.x=1.18;g.add(ring)}if(i===1){for(let m=0;m<2;m++){const moon=new THREE.Mesh(new THREE.SphereGeometry(.65-m*.18,20,20),new THREE.MeshPhongMaterial({color:0xf7d7cc}));moon.position.set(m?-6.5:6.2,m?-1:1.2,m?1:-1);g.add(moon)}}const a=i/6*Math.PI*2+.3,rad=28+(i%2)*10;g.position.set(Math.cos(a)*rad,(i%3-1)*6,Math.sin(a)*rad);g.userData={baseY:g.position.y,phase:i*1.1};scene.add(g);planets.push(p);groups.push(g)});
let yaw=0,pitch=.08,drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-lastX,e.clientY-lastY)<8)pick(e);drag=false});addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.005;pitch=Math.max(-.4,Math.min(.45,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}else hover(e)});
function setCamera(){camera.position.x=Math.sin(yaw)*78;camera.position.z=Math.cos(yaw)*78;camera.position.y=22+pitch*45;camera.lookAt(0,0,0)}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById('tooltip');function hit(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(planets,false)[0]}function hover(e){const h=hit(e);if(h){tip.textContent=h.object.userData.subject.name;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.opacity=1}else tip.style.opacity=0}function pick(e){const h=hit(e);if(h)openWorld(h.object.userData.subject)}
const world=document.getElementById('world'),route=document.getElementById('route'),modal=document.getElementById('modal');let current=null,currentLevel=0;const key='universoEscolarProgress';let progress={};try{progress=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){}
const pts=[['7%','75%'],['24%','38%'],['39%','42%'],['53%','75%'],['67%','47%'],['80%','30%'],['93%','55%']];
function openWorld(s){current=s;world.style.setProperty('--accent',s.accent);world.style.setProperty('--soft',s.soft);world.style.setProperty('--glow',s.soft);document.getElementById('worldName').textContent=s.name;document.getElementById('worldDesc').textContent=s.desc;makeParticles();renderLevels();world.classList.add('open')}
function makeParticles(){const host=document.getElementById('particles');host.innerHTML='';for(let i=0;i<40;i++){const p=document.createElement('i');p.className='p';p.style.left=Math.random()*100+'%';p.style.setProperty('--d',(6+Math.random()*8)+'s');p.style.animationDelay=(-Math.random()*8)+'s';host.appendChild(p)}}
function renderLevels(){route.querySelectorAll('.level').forEach(x=>x.remove());const done=progress[current.id]||[];current.levels.forEach((name,i)=>{const ok=i===0||done.includes(i-1),fin=done.includes(i),b=document.createElement('button');b.className='level '+(fin?'completed':ok?'available':'locked');b.disabled=!ok;b.style.setProperty('--x',pts[i][0]);b.style.setProperty('--y',pts[i][1]);b.innerHTML='<span>'+(fin?'⭐':ok?'▶':'🔒')+'</span><b>NIVEL '+(i+1)+'</b><i>'+name+'</i>';if(ok)b.onclick=()=>openLevel(i);route.appendChild(b)});document.getElementById('bar').style.width=(done.length/current.levels.length*100)+'%'}
function openLevel(i){currentLevel=i;document.getElementById('meta').textContent=current.name.toUpperCase()+' · NIVEL '+(i+1);document.getElementById('levelName').textContent=current.levels[i];document.getElementById('levelDesc').textContent='Misión preparada para integrar preguntas y minijuegos de '+current.name+'. Completa este nivel para desbloquear el siguiente.';modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}document.getElementById('close').onclick=closeModal;document.getElementById('complete').onclick=()=>{const a=progress[current.id]||[];if(!a.includes(currentLevel)){a.push(currentLevel);progress[current.id]=a;localStorage.setItem(key,JSON.stringify(progress))}closeModal();renderLevels()};document.getElementById('back').onclick=()=>world.classList.remove('open');
window.androidBack=()=>{if(modal.classList.contains('open')){closeModal();return true}if(world.classList.contains('open')){world.classList.remove('open');return true}return false};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();core.rotation.y+=.002;groups.forEach((g,i)=>{g.rotation.y+=.002+i*.00015;g.position.y=g.userData.baseY+Math.sin(t*.65+g.userData.phase)*1.2});setCamera();renderer.render(scene,camera)}animate();
</script></body></html>
